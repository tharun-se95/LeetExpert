<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="leetExpert">
  <title>leetExpert</title>
  <!--
    Source of truth for the brand mark, rounded-plate variant. Mirrors
    src/app/icon.svg exactly (that file IS this one, kept in sync by hand
    since Next's icon.svg convention requires the file to live under
    src/app/) — see that file's comment for the design rationale. This copy
    exists so scripts/generate-icons.mjs has one canonical source to
    rasterize from without importing out of the app router tree.
  -->
  <rect width="64" height="64" rx="14" fill="#1E293B" />
  <g
    fill="none"
    stroke="#FFFFFF"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M22 16 L12 32 L22 48" />
    <path d="M42 16 L52 32 L42 48" />
    <path d="M25 33 L30 40 L41 24" />
  </g>
</svg>
