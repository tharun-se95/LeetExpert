<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    apple-icon.png source. iOS renders a transparent touch icon on black and
    applies its own squircle, so this is an opaque full-bleed square with no
    corner rounding. Dark tile so the lamp keeps its glow on every phone:
    #5be07a on #060607 is 11.95:1. The lamp is scaled to 72% so the halo
    clears the squircle's corners. Colours mirror the dark press-lamp
    tokens and press-paper.
  -->
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5be07a" stop-opacity="0.85" />
      <stop offset="33%" stop-color="#5be07a" stop-opacity="0.42" />
      <stop offset="69%" stop-color="#5be07a" stop-opacity="0.11" />
      <stop offset="100%" stop-color="#5be07a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="core" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#cfffd8" />
      <stop offset="45%" stop-color="#5be07a" />
      <stop offset="100%" stop-color="#2fb455" />
    </radialGradient>
  </defs>
  <rect width="64" height="64" fill="#060607" />
  <g transform="translate(32 32) scale(0.72) translate(-32 -32)">
    <circle cx="32" cy="32" r="30" fill="url(#halo)" />
    <circle cx="32" cy="32" r="15" fill="url(#core)" />
  </g>
</svg>
