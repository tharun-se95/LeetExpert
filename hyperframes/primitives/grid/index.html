ps\": [], \"note\": \"On the top edge there is only one route: keep going right.\"}, {\"cur\": [0, 3], \"values\": [[\"1\", \"1\", \"1\", \"1\"], [\"\", \"\", \"\", \"\"], [\"\", \"\", \"\", \"\"], [\"\", \"\", \"\", \"\"]], \"deps\": [], \"note\": \"On the top edge there is only one route: keep going right.\"}, {\"cur\": [1, 0], \"values\": [[\"1\", \"1\", \"1\", \"1\"], [\"1\", \"\", \"\", \"\"], [\"\", \"\", \"\", \"\"], [\"\", \"\", \"\", \"\"]], \"deps\": [], \"note\": \"On the left edge there is only one route: keep going down.\"}, {\"cur\": [1, 1], \"values\": [[\"1\", \"1\", \"1\", \"1\"], [\"1\", \"2\", \"\", \"\"], [\"\", \"\", \"\", \"\"], [\"\", \"\", \"\", \"\"]], \"deps\": [[0, 1], [1, 0]], \"note\": \"Every path into (1,1) arrives from above or from the left, so <b>1 + 1 = 2</b>.\"}, {\"cur\": [1, 2], \"values\": [[\"1\", \"1\", \"1\", \"1\"], [\"1\", \"2\", \"3\", \"\"], [\"\", \"\", \"\", \"\"], [\"\", \"\", \"\", \"\"]], \"deps\": [[0, 2], [1, 1]], \"note\": \"Every path into (1,2) arrives from above or from the left, so <b>1 + 2 = 3</b>.\"}, {\"cur\": [1, 3], \"values\": [[\"1\", \"1\", \"1\", \"1\"], [\"1\", \"2\", \"3\", \"4\"], [\"\", \"\", \"\", \"\"], [\"\", \"\", \"\", \"\"]], \"deps\": [[0, 3], [1, 2]], \"note\": \"Every path into (1,3) arrives from above or from the left, so <b>1 + 3 = 4</b>.\"}, {\"cur\": [2, 0], \"values\": [[\"1\", \"1\", \"1\", \"1\"], [\"1\", \"2\", \"3\", \"4\"], [\"1\", \"\", \"\", \"\"], [\"\", \"\", \"\", \"\"]], \"deps\": [], \"note\": \"On the left edge there is only one route: keep going down.\"}, {\"cur\": [2, 1], \"values\": [[\"1\", \"1\", \"1\", \"1\"], [\"1\", \"2\", \"3\", \"4\"], [\"1\", \"3\", \"\", \"\"], [\"\", \"\", \"\", \"\"]], \"deps\": [[1, 1], [2, 0]], \"note\": \"Every path into (2,1) arrives from above or from the left, so <b>2 + 1 = 3</b>.\"}, {\"cur\": [2, 2], \"values\": [[\"1\", \"1\", \"1\", \"1\"], [\"1\", \"2\", \"3\", \"4\"], [\"1\", \"3\", \"6\", \"\"], [\"\", \"\", \"\", \"\"]], \"deps\": [[1, 2], [2, 1]], \"note\": \"Every path into (2,2) arrives from above or from the left, so <b>3 + 3 = 6</b>.\"}, {\"cur\": [2, 3], \"values\": [[\"1\", \"1\", \"1\", \"1\"], [\"1\", \"2\", \"3\", \"4\"], [\"1\", \"3\", \"6\", \"10\"], [\"\", \"\", \"\", \"\"]], \"deps\": [[1, 3], [2, 2]], \"note\": \"Every path into (2,3) arrives from above or from the left, so <b>4 + 6 = 10</b>.\"}, {\"cur\": [3, 0], \"values\": [[\"1\", \"1\", \"1\", \"1\"], [\"1\", \"2\", \"3\", \"4\"], [\"1\", \"3\", \"6\", \"10\"], [\"1\", \"\", \"\", \"\"]], \"deps\": [], \"note\": \"On the left edge there is only one route: keep going down.\"}, {\"cur\": [3, 1], \"values\": [[\"1\", \"1\", \"1\", \"1\"], [\"1\", \"2\", \"3\", \"4\"], [\"1\", \"3\", \"6\", \"10\"], [\"1\", \"4\", \"\", \"\"]], \"deps\": [[2, 1], [3, 0]], \"note\": \"Every path into (3,1) arrives from above or from the left, so <b>3 + 1 = 4</b>.\"}, {\"cur\": [3, 2], \"values\": [[\"1\", \"1\", \"1\", \"1\"], [\"1\", \"2\", \"3\", \"4\"], [\"1\", \"3\", \"6\", \"10\"], [\"1\", \"4\", \"10\", \"\"]], \"deps\": [[2, 2], [3, 1]], \"note\": \"Every path into (3,2) arrives from above or from the left, so <b>6 + 4 = 10</b>.\"}, {\"cur\": [3, 3], \"values\": [[\"1\", \"1\", \"1\", \"1\"], [\"1\", \"2\", \"3\", \"4\"], [\"1\", \"3\", \"6\", \"10\"], [\"1\", \"4\", \"10\", \"20\"]], \"deps\": [[2, 3], [3, 2]], \"note\": \"Every path into (3,3) arrives from above or from the left, so <b>10 + 10 = 20</b>.\"}, {\"cur\": null, \"values\": [[\"1\", \"1\", \"1\", \"1\"], [\"1\", \"2\", \"3\", \"4\"], [\"1\", \"3\", \"6\", \"10\"], [\"1\", \"4\", \"10\", \"20\"]], \"deps\": [], \"note\": \"The bottom-right cell holds the answer: <b>20</b> distinct paths. Every cell was computed once \\u2014 that is what turns an exponential search into 4x4 work.\"}]"}, {"id": "stepSeconds", "type": "number", "label": "Seconds per step", "default": 1.0, "min": 0.3, "max": 8, "step": 0.1}, {"id": "compact", "type": "boolean", "label": "Compact: structure     <style>
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { width: 1920px; height: 1080px; padding: 88px 112px; display: flex; flex-direction: column; }
      .head { display: flex; flex-direction: column; gap: 20px; }
      .rule { width: 132px; height: 5px; background: var(--accent, var(--ink)); border-radius: 3px; }
      .eyebrow { font-size: 26px; }
      .title { font-size: 68px; }
      .board { flex: 1; display: flex; align-items: center; gap: 96px; }
      .gridwrap { display: flex; flex-direction: column; gap: 10px; }
      .axisrow { display: flex; gap: 10px; }
      .axiscell, .axisspacer {
        font-family: "JetBrains Mono", monospace; font-size: 20px; color: var(--dim);
        display: flex; align-items: center; justify-content: center;
      }
      .gline { display: flex; gap: 10px; align-items: center; }
      /* Compact: the grid alone, centred; the recurrence and legend would draw at ~8px. */
      #root[data-compact] .board { justify-content: center; }
      #root[data-compact] .side { display: none; }
      .gcell {
        border: 2.5px solid var(--rule-strong); border-radius: 10px;
        display: flex; align-items: center; justify-content: center;
        font-family: "JetBrains Mono", monospace; font-weight: 700; color: var(--ink);
        background: transparent;
      }
      /* Three states carry the whole idea of a DP fill: what is already known,
         what this step reads, and what it is writing. */
      .gcell[data-state="filled"] { border-color: var(--line); }
      .gcell[data-state="dep"] { border-color: var(--accent, var(--ink)); border-width: 3.5px; }
      .gcell[data-state="cur"] { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
      .side { display: flex; flex-direction: column; gap: 26px; max-width: 620px; }
      .recur {
        font-family: "JetBrains Mono", monospace; font-size: 26px; line-height: 1.5; color: var(--ink);
        border-left: 4px solid var(--accent, var(--ink)); padding-left: 22px; white-space: nowrap;
      }
      .legend { display: flex; flex-direction: column; gap: 14px; }
      .lrow { display: flex; align-items: center; gap: 16px;
        font-family: "Space Grotesk", sans-serif; font-size: 25px; color: var(--line); }
      .swatch { width: 34px; height: 34px; border-radius: 8px; border: 2.5px solid var(--rule-strong); flex: none; }
      .swatch.dep { border-color: var(--accent, var(--ink)); border-width: 3.5px; }
      .swatch.cur { background: var(--ink); border-color: var(--ink); }
      .note {
        font-family: "Space Grotesk", sans-serif; font-size: 31px; line-height: 1.45;
        color: var(--line); max-width: 1180px; min-height: 84px;
      }
      .note b { color: var(--ink); font-weight: 700; }
      .foot { display: flex; align-items: flex-end; justify-content: space-between; margin-top: 14px; }
      .wordmark { font-size: 30px; }
      .counter { font-family: "Space Mono", monospace; font-size: 22px; letter-spacing: .16em; color: var(--dim); }
    </style>
  </head>
  <body>
    <div id="root" class="stage" data-composition-id="grid" data-start="0"
         data-width="1920" data-height="1080">
      <div class="head">
        <div class="rule"></div>
        <div class="eyebrow" id="eyebrow"></div>
        <div class="title display" id="title"></div>
      </div>
      <div class="board">
        <div class="gridwrap" id="gridwrap"></div>
        <div class="side">
          <div class="recur" id="recur"></div>
          <div class="legend">
            <div class="lrow"><span class="swatch cur"></span> the cell being written</div>
            <div class="lrow"><span class="swatch dep"></span> the cells it reads</div>
            <div class="lrow"><span class="swatch"></span> not yet computed</div>
          </div>
        </div>
      </div>
      <div class="note" id="note"></div>
      <div class="foot">
        <span class="wordmark">leetExpert</span>
        <span class="counter" id="counter"></span>
      </div>
    </div>
    <script>
      const V = window.__hyperframes.getVariables();
      const root = document.getElementById("root");
      root.setAttribute("data-theme", V.theme);
      root.setAttribute("data-family", V.family);
      if (V.compact) root.setAttribute("data-compact", "");
      document.getElementById("eyebrow").textContent = V.eyebrow;
      document.getElementById("title").textContent = V.title;
      document.getElementById("recur").textContent = V.recurrence;

      const R = Number(V.rows), C = Number(V.cols);
      const steps = JSON.parse(V.steps);
      const wrap = document.getElementById("gridwrap");

      // Cell size is derived from the grid's own dimensions so a 4x4 and a 10x8
      // both fit the same board without re-authoring.
      // A compact frame has no header, so its board is font-independent and
      // can be measured here; the full frame keeps its authored box.
      const board = document.querySelector(".board");
      const MAXW = V.compact ? board.clientWidth : 820, MAXH = V.compact ? board.clientHeight : 470;
      const GAP = 10, AX = 34;
      const size = Math.max(40, Math.min(
        116,
        Math.floor((MAXW - AX - (C - 1) * GAP) / C),
        Math.floor((MAXH - AX - (R - 1) * GAP) / R)
      ));
      const font = Math.max(18, Math.min(40, Math.floor(size * 0.42)));

      if (V.showAxes) {
        const ar = document.createElement("div");
        ar.className = "axisrow";
        const sp = document.createElement("div");
        sp.className = "axisspacer"; sp.style.width = AX + "px"; sp.style.height = AX + "px";
        ar.appendChild(sp);
        for (let c = 0; c < C; c++) {
          const a = document.createElement("div");
          a.className = "axiscell"; a.style.width = size + "px"; a.style.height = AX + "px";
          a.textContent = c; ar.appendChild(a);
        }
        wrap.appendChild(ar);
      }
      for (let r = 0; r < R; r++) {
        const line = document.createElement("div");
        line.className = "gline";
        if (V.showAxes) {
          const a = document.createElement("div");
          a.className = "axiscell"; a.style.width = AX + "px"; a.style.height = size + "px";
          a.textContent = r; line.appendChild(a);
        }
        for (let c = 0; c < C; c++) {
          const cell = document.createElement("div");
          cell.className = "gcell"; cell.id = "g-" + r + "-" + c;
          cell.style.width = size + "px"; cell.style.height = size + "px";
          cell.style.fontSize = font + "px";
          line.appendChild(cell);
        }
        wrap.appendChild(line);
      }

      const noteEl = document.getElementById("note");
      const counterEl = document.getElementById("counter");
      const STEP = Number(V.stepSeconds);
      const key = (p) => p[0] + "," + p[1];

      document.fonts.ready.then(() => {
        const tl = gsap.timeline({ paused: true });
        steps.forEach((s, k) => {
          const t = k * STEP;
          const deps = new Set((s.deps || []).map(key));
          const cur = s.cur ? key(s.cur) : null;
          for (let r = 0; r < R; r++) {
            for (let c = 0; c < C; c++) {
              const id = r + "," + c;
              const val = (s.values && s.values[r] && s.values[r][c] !== undefined) ? s.values[r][c] : "";
              const state = cur === id ? "cur" : (deps.has(id) ? "dep" : (val !== "" ? "filled" : "empty"));
              tl.set("#g-" + r + "-" + c,
                     { attr: { "data-state": state }, textContent: val }, t);
            }
          }
          tl.set(noteEl, { innerHTML: s.note }, t);
          tl.set(counterEl, { textContent: "STEP " + (k + 1) + " / " + steps.length }, t);
          if (k === 0) tl.from(noteEl, { opacity: 0, y: 12, duration: 0.45, ease: "power3.out" }, 0.15);
        });
        tl.to({}, { duration: STEP * 2 }, (steps.length - 1) * STEP);
        window.__timelines["grid"] = tl;
        // Registered after the runtime initialised, so it must be re-bound: without
        // this `render` saw a zero-length composition ("Composition has zero
        // duration") although `snapshot` and the browser played it.
        window.__hfForceTimelineRebind?.();
      });
    </script>
  </body>
