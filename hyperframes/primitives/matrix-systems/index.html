    <style>
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 1920px; height: 1080px; }
      #content { position: absolute; inset: 0; padding: 64px 96px 52px; display: flex; flex-direction: column; }
      .head { display: flex; flex-direction: column; gap: 14px; }
      .rule { width: 132px; height: 5px; background: var(--accent, var(--ink)); border-radius: 3px; transform-origin: 0 50%; }
      .headrow { display: flex; align-items: center; justify-content: space-between; }
      .eyebrow { font-size: 24px; }
      .systag { display: flex; align-items: center; gap: 14px; font-family: "Space Mono", monospace; font-size: 22px; letter-spacing: .14em; text-transform: uppercase; color: var(--line); }
      .ic { width: 38px; height: 38px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .title { font-size: 64px; line-height: 1.08; }
      .main { position: relative; flex: 1; min-height: 0; display: flex; gap: 64px; margin-top: 22px; padding-bottom: 22px; }
      #stage { flex: none; width: 1104px; height: 100%; display: flex; gap: 48px; justify-content: center; align-items: center; }
      .grp { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
      .bw { display: flex; flex-direction: column; align-items: center; gap: 10px; }
      .bl { font-family: "JetBrains Mono", monospace; font-size: 21px; height: 24px; line-height: 24px; color: var(--dim); white-space: nowrap; }
      .brd { position: relative; }
      .brd.grid { display: grid; }
      .brd.strip { display: flex; align-items: center; }
      .cell { display: flex; align-items: center; justify-content: center; font-family: "JetBrains Mono", monospace; font-weight: 500; flex: none;
        box-shadow: inset 0 0 0 1px var(--rule-strong); }
      .ov { position: absolute; border: 5px solid var(--k-cur); border-radius: 14px; background: color-mix(in srgb, var(--k-cur) 14%, transparent); opacity: 0; pointer-events: none; }
      .ov.bounds { border: 4px dashed var(--k-acc); background: transparent; border-radius: 10px; }
      .side { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 26px; justify-content: center; }
      .note { font-family: "Space Grotesk", sans-serif; font-size: 29px; line-height: 1.45; color: var(--ink); min-height: 300px; }
      .stats { display: flex; flex-wrap: wrap; gap: 12px; min-height: 54px; }
      .chip { font-family: "JetBrains Mono", monospace; font-size: 23px; padding: 7px 16px; border: 2px solid var(--rule-strong); border-radius: 999px; color: var(--line); white-space: nowrap; }
      .chip b { color: var(--ink); font-weight: 500; }
      .seenwrap { display: flex; flex-direction: column; gap: 12px; padding-top: 22px; border-top: 2px solid var(--rule); }
      .seenlab { font-family: "Space Mono", monospace; font-size: 19px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
      .seen { display: flex; flex-wrap: wrap; gap: 10px; }
      .seen span { font-family: "Space Grotesk", sans-serif; font-size: 22px; padding: 5px 14px; border-radius: 999px; background: var(--panel); color: var(--line); }
      .foot { display: flex; align-items: center; gap: 36px; margin-top: 18px; }
      .wordmark { font-size: 28px; }
      .bar { flex: 1; height: 4px; background: var(--rule-strong); border-radius: 2px; overflow: hidden; }
      .bar i { display: block; width: 100%; height: 100%; background: var(--accent, var(--ink)); transform-origin: 0 50%; }
      .counter { font-family: "Space Mono", monospace; font-size: 21px; letter-spacing: .16em; color: var(--dim); min-width: 190px; text-align: right; }
      /* Vignette artwork: the same classes the artifact draws with, on tokens. */
      .art .st { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .art .fa { fill: var(--k-acc); opacity: .28; }
      .art .fb { fill: var(--k-acc); }
      .art .fc { fill: var(--k-cur); }
      .art .fr { fill: var(--k-bad); }
      .art .fg { fill: var(--k-done); }
      .art .fp { fill: var(--panel); }
      .art .sc { stroke: var(--k-cur); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      #intro { position: absolute; inset: 0; background: var(--ground); display: flex; align-items: center; justify-content: space-between; gap: 64px; padding: 96px 112px;
        background-image: radial-gradient(var(--dot) 1.6px, transparent 1.6px); background-size: 26px 26px; background-position: 13px 13px; }
      #intro .copy { display: flex; flex-direction: column; gap: 26px; max-width: 900px; }
      #intro .ic { width: 96px; height: 96px; stroke-width: 1.4; color: var(--k-acc); }
      #i-rule { width: 132px; height: 5px; background: var(--accent, var(--ink)); border-radius: 3px; transform-origin: 0 50%; }
      #i-eyebrow { font-family: "Space Mono", monospace; font-size: 26px; letter-spacing: .12em; text-transform: uppercase; color: var(--line); }
      #i-title { font-size: 92px; line-height: 1.06; }
      #i-art { flex: none; width: 700px; }
      #i-art svg { width: 700px; height: 327px; display: block; }
      #outro { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 40px; }
      .fact { flex: 1; max-width: 520px; display: flex; flex-direction: column; gap: 16px; padding: 30px 32px; border-radius: 18px; background: var(--panel); border: 2px solid var(--rule); }

      .fact span { font-family: "Space Grotesk", sans-serif; font-size: 27px; line-height: 1.4; color: var(--line); }

        <symbol id="i-pages" viewBox="0 0 24 24"><path d="M4 6c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3z"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></symbol>
        <symbol id="i-chip" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 3v3M12 3v3M15 3v3M9 18v3M12 18v3M15 18v3M3 9h3M3 12h3M3 15h3M18 9h3M18 12h3M18 15h3"/><path d="M9 15h3v-3h3V9" stroke-width="1.8"/></symbol>
      </defs>
    </svg>
    <div id="root" class="stage" data-composition-id="matrix-systems" data-start="0"
         data-width="1920" data-height="1080">
      <div id="content">
      <div class="head">
        <div class="rule" id="rule"></div>
        <div class="headrow">
          <div class="eyebrow" id="eyebrow"></div>
          <div class="systag"><svg class="ic" id="tag-ic"><use id="tag-use" href="#i-screen"/></svg><span id="systag"></span></div>
        </div>
        <div class="title display" id="title"></div>
      </div>
      <div class="main">
        <div id="stage"></div>
        <div class="side" id="side">
          <div class="note" id="note"></div>
          <div class="stats" id="stats"></div>
          <div class="seenwrap"><div class="seenlab">Where you have seen it</div><div class="seen" id="seen"></div></div>
        </div>
        <div id="outro"></div>
      </div>
      <div class="foot">
        <span class="wordmark">leetExpert</span>
        <div class="bar"><i id="bar"></i></div>
        <span class="counter" id="counter"></span>
      </div>
      </div>
      <div id="intro">
        <div class="copy">
          <div id="i-rule"></div>
          <svg class="ic" id="i-ic"><use id="i-use" href="#i-screen"/></svg>
          <div id="i-eyebrow"></div>
          <div id="i-title" class="display"></div>
        </div>
        <div id="i-art" class="art"></div>
      </div>
    </div>
    <script>
      const V = window.__hyperframes.getVariables();
      const $ = (s) => document.querySelector(s);
      const root = $("#root");
      root.setAttribute("data-theme", V.theme);
      root.setAttribute("data-family", V.family);
      const boards = JSON.parse(V.boards), frames = JSON.parse(V.frames);
      const seen = JSON.parse(V.seen), facts = JSON.parse(V.facts);
      const STEP = Number(V.stepSeconds), T0 = Number(V.introSeconds), N = frames.length;
      // Narrated builds pass measured frame times; without them frames run at a fixed step.
      const FT = JSON.parse(V.frameTimes || "[]"), timed = FT.length === N;
      const FACT_T = JSON.parse(V.factTimes || "[]");
      const at = (k) => T0 + (timed ? FT[k] : k * STEP);
      let minGap = STEP;
      if (timed) { minGap = Infinity; for (let k = 1; k < N; k++) minGap = Math.min(minGap, FT[k] - FT[k - 1]); }

      $("#eyebrow").textContent = V.eyebrow;
      $("#title").textContent = V.title;
      $("#systag").textContent = V.system;
      $("#tag-use").setAttribute("href", "#" + V.icon);
      $("#i-use").setAttribute("href", "#" + V.icon);
      $("#i-eyebrow").textContent = V.eyebrow;
      $("#i-title").textContent = V.title;
      $("#i-art").innerHTML = '<svg viewBox="0 0 240 112" aria-hidden="true">' + V.vignette + "</svg>";
      seen.forEach((s) => { const e = document.createElement("span"); e.textContent = s; $("#seen").appendChild(e); });
      $("#outro").innerHTML = facts.map((f) => '<div class="fact"><b>' + f.v + "</b><span>" + f.l + "</span></div>").join("");

      // Palette comes from the CSS tokens so a theme switch recolours the video.
      const KINDS = ["idle","cur","acc","done","bad","warn","dim","viol","land","water","win"];
      const cs0 = getComputedStyle(root), PAL = {};
      const rgb = (h) => { h = h.trim(); const m = h.match(/^#([0-9a-f]{6})$/i);
        return m ? [0,2,4].map((i) => parseInt(m[1].slice(i, i + 2), 16)) : h.match(/[\d.]+/g).slice(0,3).map(Number); };
      KINDS.forEach((k) => { PAL[k] = { f: rgb(cs0.getPropertyValue("--k-" + k)), i: rgb(cs0.getPropertyValue("--k-" + k + "-ink")) }; });
      const mix = (a, b, p) => a.map((v, i) => Math.round(v + (b[i] - v) * p));
      const css = (a) => "rgb(" + a[0] + "," + a[1] + "," + a[2] + ")";
      // [kind, text, shade]: shade mixes the idle fill toward the accent (image-like grids).
      const look = (c) => {
        const P = PAL[c[0]] || PAL.idle;
        if (c[2] != null) return { f: css(mix(PAL.idle.f, PAL.acc.f, c[2])), i: css(c[2] > 0.55 ? PAL.acc.i : PAL.idle.i) };
        return { f: css(P.f), i: css(P.i) };
      };

      const stage = $("#stage");
      const noteEl = $("#note"), statsEl = $("#stats"), counterEl = $("#counter");
      const statsHtml = (s) => (s || []).map((x) => '<span class="chip">' + x[0] + " <b>" + x[1] + "</b></span>").join("");

      document.fonts.ready.then(() => {
        // Geometry is measured after fonts load: the header height (and so the
        // stage height) depends on the real glyph metrics.
        const STAGE_W = 1104, STAGE_H = stage.clientHeight;
        const GAPC = 10, LABEL = 34, GG = 18, STRIPH = 36, SGAP = 3, LINEGAP = 10;
        const groups = [];
        boards.forEach((b) => { (groups[b.g] = groups[b.g] || []).push(b); });
        const gw = (STAGE_W - (groups.length - 1) * 48) / groups.length;
        const els = {}, ovs = {};

        groups.forEach((g) => {
          const gEl = document.createElement("div"); gEl.className = "grp"; stage.appendChild(gEl);
          let fixed = g.length * LABEL + (g.length - 1) * GG;
          g.forEach((b) => { if (b.strip) fixed += STRIPH; });
          const grids = g.filter((b) => !b.strip);
          g.forEach((b) => {
            const w = document.createElement("div"); w.className = "bw";
            const lab = document.createElement("div"); lab.className = "bl"; lab.textContent = b.label;
            const brd = document.createElement("div");
            w.appendChild(lab); w.appendChild(brd); gEl.appendChild(w);
            els[b.id] = [];
            if (b.strip) {
              const extra = Math.floor((b.cols - 1) / 4) * LINEGAP;
              b.cs = Math.floor((gw - (b.cols - 1) * SGAP - extra) / b.cols);
              b.gap = SGAP; brd.className = "brd strip"; brd.style.gap = SGAP + "px";
              for (let i = 0; i < b.cols; i++) {
                const c = document.createElement("div"); c.className = "cell";
                c.style.width = b.cs + "px"; c.style.height = STRIPH + "px"; c.style.borderRadius = "3px";
                if (i > 0 && i % 4 === 0) c.style.marginLeft = LINEGAP + "px";
                brd.appendChild(c); els[b.id].push(c);
              }
            } else {
              const availH = (STAGE_H - fixed) / grids.length;
              const cw = Math.floor((gw - (b.cols - 1) * GAPC) / b.cols), ch = Math.floor((availH - (b.rows - 1) * GAPC) / b.rows);
              b.cs = Math.max(28, Math.min(b.cap ? Math.round(b.cap * 1.6) : 104, cw, ch));
              b.gap = GAPC; brd.className = "brd grid";
              brd.style.gridTemplateColumns = "repeat(" + b.cols + "," + b.cs + "px)"; brd.style.gap = GAPC + "px";
              for (let i = 0; i < b.rows * b.cols; i++) {
                const c = document.createElement("div"); c.className = "cell";
                c.style.width = b.cs + "px"; c.style.height = b.cs + "px";
                c.style.fontSize = Math.round(b.cs * 0.42) + "px"; c.style.borderRadius = Math.round(b.cs * 0.16) + "px";
                brd.appendChild(c); els[b.id].push(c);
              }
            }
            const ov = document.createElement("div"); ov.className = "ov"; brd.appendChild(ov); ovs[b.id] = ov;
            b.el = brd;
          });
        });

        const rect = (b, o) => {
          const st = b.cs + b.gap;
          return { left: o.c0 * st - 6, top: o.r0 * st - 6, width: (o.c1 - o.c0 + 1) * st - b.gap + 12, height: (o.r1 - o.r0 + 1) * st - b.gap + 12 };
        };
        const byId = {}; boards.forEach((b) => { byId[b.id] = b; });

        // Frame 0 is the static end-state the timeline animates away from.
        const paint = (id, i, c) => { const L = look(c), e = els[id][i]; e.style.background = L.f; e.style.color = L.i; e.textContent = c[1] || ""; };
        boards.forEach((b) => frames[0].b[b.id].forEach((c, i) => paint(b.id, i, c)));
        noteEl.innerHTML = frames[0].note; statsEl.innerHTML = statsHtml(frames[0].stats);
        counterEl.textContent = "STEP 1 / " + N;

        const D = Math.min(0.32, minGap * 0.6);
        const tl = gsap.timeline({ paused: true });

        // Intro: the system named before the boards appear.
        tl.fromTo("#i-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, 0.05);
        tl.fromTo("#i-ic", { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(2)" }, 0.12);
        tl.fromTo("#i-eyebrow", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.25);
        tl.fromTo("#i-title", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power4.out" }, 0.35);
        tl.fromTo("#i-art", { x: 70, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.3);
        tl.to("#intro", { opacity: 0, duration: 0.25, ease: "power2.in" }, T0 - 0.25);
        tl.set("#intro", { visibility: "hidden" }, T0);
        // A hard cut, not a crossfade: the boards are never visible under the intro card.
        tl.set("#content", { autoAlpha: 0 }, 0);
        tl.set("#content", { autoAlpha: 1 }, T0);
        tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, T0);

        frames.forEach((fr, k) => {
          if (k === 0) return;
          const t = at(k), pf = frames[k - 1];
          boards.forEach((b) => {
            const a = pf.b[b.id], c = fr.b[b.id];
            for (let i = 0; i < c.length; i++) {
              if (a[i][0] === c[i][0] && a[i][1] === c[i][1] && a[i][2] === c[i][2]) continue;
              const L = look(c[i]), e = els[b.id][i];
              tl.to(e, { backgroundColor: L.f, color: L.i, duration: D, ease: "power2.inOut" }, t);
              if (a[i][1] !== c[i][1]) tl.set(e, { textContent: c[i][1] || "" }, t + D * 0.35);
              // Overlapping pulses on one cell would fight; frames are always longer than 2*D/1.2.
              tl.to(e, { scale: 1.12, duration: D * 0.45, ease: "power2.out" }, t);
              tl.to(e, { scale: 1, duration: D * 0.55, ease: "power2.in" }, t + D * 0.45);
            }
            const po = pf.ov && pf.ov[b.id], co = fr.ov && fr.ov[b.id];
            if (co) {
              const r = rect(b, co);
              if (!po) { tl.set(ovs[b.id], r, t); tl.to(ovs[b.id], { opacity: 1, duration: D }, t); }
              else tl.to(ovs[b.id], Object.assign({ duration: D * 1.4, ease: "power3.inOut" }, r), t);
              ovs[b.id].classList.toggle("bounds", co.cls === "bounds");
            } else if (po) tl.to(ovs[b.id], { opacity: 0, duration: D }, t);
          });
          tl.set(noteEl, { innerHTML: fr.note, opacity: 0.25 }, t);
          tl.to(noteEl, { opacity: 1, duration: 0.3, ease: "power2.out" }, t);
          tl.set(statsEl, { innerHTML: statsHtml(fr.stats) }, t);
          tl.set(counterEl, { textContent: "STEP " + (k + 1) + " / " + N }, t);
        });
        // Frame-0 overlays (the spiral's opening rectangle, the filter's window) exist before the first tween.
        boards.forEach((b) => {
          const co = frames[0].ov && frames[0].ov[b.id];
          if (co) { Object.assign(ovs[b.id].style, { left: rect(b, co).left + "px", top: rect(b, co).top + "px", width: rect(b, co).width + "px", height: rect(b, co).height + "px", opacity: 1 }); ovs[b.id].classList.toggle("bounds", co.cls === "bounds"); }
        });

        const lastAt = at(N - 1);
        const outroAt = Number(V.outroAt) > 0 ? Number(V.outroAt) : lastAt + STEP * 1.2;
        const total = Number(V.totalSeconds) > 0 ? Number(V.totalSeconds) : outroAt + 4.2;
        tl.fromTo("#bar", { scaleX: 0 }, { scaleX: 1, duration: outroAt - T0, ease: "none" }, T0);
        // Cut from the boards to the fact cards so the two never share the frame.
        tl.set(["#stage", "#side"], { autoAlpha: 0 }, outroAt);
        document.querySelectorAll(".fact").forEach((f, i) => {
          const rel = FACT_T.length ? FACT_T[i] : 0.1 + i * 0.28;
          tl.fromTo(f, { y: 44, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, outroAt + rel);
        });
        tl.to({}, { duration: 0.01 }, total - 0.01);

        window.__timelines["matrix-systems"] = tl;
        // Registered after the runtime initialised, so it must be re-bound (see the grid primitive).
        window.__hfForceTimelineRebind?.();
      });
    </script>
  </body>
</html>
