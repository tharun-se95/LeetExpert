    <style>
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { width: 1920px; height: 1080px; padding: 88px 112px; display: flex; flex-direction: column; }
      .head { display: flex; flex-direction: column; gap: 20px; }
      .rule { width: 132px; height: 5px; background: var(--accent, var(--ink)); border-radius: 3px; }
      .eyebrow { font-size: 26px; }
      .title { font-size: 72px; }
      .board { flex: 1; position: relative; }
      #tree { position: absolute; inset: 0; }
      #edges { position: absolute; inset: 0; overflow: visible; }
      .tnode {
        position: absolute; width: 96px; height: 96px; margin: -48px 0 0 -48px;
        border: 2.5px solid var(--ink); border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 38px; color: var(--ink);
        background: var(--ground);
      }
      .tnode[data-state="active"] { background: var(--ink); color: var(--on-ink); }
      .tnode[data-state="done"] { border-color: var(--muted-fill); color: var(--dim); }
      .outstrip { display: flex; align-items: center; gap: 14px; min-height: 74px; }
      .outlab {
        font-family: "Space Mono", monospace; font-size: 20px; letter-spacing: .14em;
        text-transform: uppercase; color: var(--dim); margin-right: 10px;
      }
      .outcell {
        min-width: 62px; height: 62px; padding: 0 10px;
        border: 2px solid var(--rule-strong); border-radius: 10px;
        display: flex; align-items: center; justify-content: center;
        font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 30px; color: var(--ink);
      }
      .note {
        font-family: "Space Grotesk", sans-serif; font-size: 32px; line-height: 1.45;
        color: var(--line); max-width: 1180px; min-height: 88px; margin-top: 22px;
      }
      .note b { color: var(--ink); font-weight: 700; }
      .foot { display: flex; align-items: flex-end; justify-content: space-between; margin-top: 10px; }
      .wordmark { font-size: 30px; }
      .counter { font-family: "Space Mono", monospace; font-size: 22px; letter-spacing: .16em; color: var(--dim); }
      /* Compact keeps the output strip but not its label, which would draw at ~7px. */
      #root[data-compact] .outlab { display: none; }
    </style>
  </head>
  <body>
    <div id="root" class="stage" data-composition-id="binary-tree" data-start="0"
         data-width="1920" data-height="1080">
      <div class="head">
        <div class="rule"></div>
        <div class="eyebrow" id="eyebrow"></div>
        <div class="title display" id="title"></div>
      </div>
      <div class="board"><div id="tree"><svg id="edges"></svg></div></div>
      <div class="outstrip" id="outstrip"></div>
      <div class="note" id="note"></div>
      <div class="foot">
        <span class="wordmark">leetExpert</span>
        <span class="counter" id="counter"></span>
      </div>
    </div>
    <script>
      const V = window.__hyperframes.getVariables();
      const root = document.getElementById("root");
      root.setAttribute("data-theme", V.theme);
      root.setAttribute("data-family", V.family);
      if (V.compact) root.setAttribute("data-compact", "");
      document.getElementById("eyebrow").textContent = V.eyebrow;
      document.getElementById("title").textContent = V.title;

      // Level-order with "." for an absent child — the same shape LeetCode uses,
      // so a tree can be pasted straight from a problem statement.
      const raw = String(V.values).split(",").map((s) => s.trim());
      const steps = JSON.parse(V.steps);
      const present = (i) => i < raw.length && raw[i] !== "." && raw[i] !== "";

      const tree = document.getElementById("tree");
      const svg = document.getElementById("edges");
      const noteEl = document.getElementById("note");
      const counterEl = document.getElementById("counter");
      const strip = document.getElementById("outstrip");
      const STEP = Number(V.stepSeconds);
      const depthOf = (i) => Math.floor(Math.log2(i + 1));
      const NODE_R = 48;

      document.fonts.ready.then(() => {
        // Measure the board only after the faces are active: the header's height
        // depends on Space Mono's metrics, and the board is a flex remainder.
        const W = tree.clientWidth;
        const boardH = tree.clientHeight;
        let maxDepth = 0;
        raw.forEach((_, i) => { if (present(i)) maxDepth = Math.max(maxDepth, depthOf(i)); });
        const usable = boardH - NODE_R * 2 - 12;
        const LEVEL = maxDepth > 0 ? usable / maxDepth : 0;
        const yTop = NODE_R + 6;

        // Complete-tree geometry: a node is slotted by its position within its
        // own level, so siblings never collide however many children are absent.
        const posOf = (i) => {
          const d = depthOf(i);
          const col = i - (Math.pow(2, d) - 1);
          return { x: ((col + 0.5) / Math.pow(2, d)) * W, y: yTop + d * LEVEL };
        };

        raw.forEach((v, i) => {
          if (!present(i)) return;
          const p = posOf(i);
          const parent = Math.floor((i - 1) / 2);
          if (i > 0 && present(parent)) {
            const q = posOf(parent);
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", q.x); line.setAttribute("y1", q.y);
            line.setAttribute("x2", p.x); line.setAttribute("y2", p.y);
            line.setAttribute("stroke", "currentColor");
            line.setAttribute("stroke-width", "2.5");
            line.setAttribute("opacity", "0.55");
            svg.appendChild(line);
          }
          const n = document.createElement("div");
          n.className = "tnode"; n.id = "tnode-" + i; n.textContent = v;
          n.style.left = p.x + "px"; n.style.top = p.y + "px";
          tree.appendChild(n);
        });
        svg.style.color = "var(--line)";

        // The output strip is pre-built at full length and revealed cell by cell,
        // so the row never reflows mid-animation — a reflow would break seeking.
        const visitCount = steps.reduce((m, s) => Math.max(m, (s.done || []).length), 0);
        if (V.showOutput && visitCount > 0) {
          const lab = document.createElement("span");
          lab.className = "outlab"; lab.textContent = V.outLabel;
          strip.appendChild(lab);
          for (let k = 0; k < visitCount; k++) {
            const c = document.createElement("div");
            c.className = "outcell"; c.id = "out-" + k;
            strip.appendChild(c);
          }
          gsap.set(".outcell", { autoAlpha: 0 });
        }

        const tl = gsap.timeline({ paused: true });
        steps.forEach((s, k) => {
          const t = k * STEP;
          const done = s.done || [];
          raw.forEach((_, i) => {
            if (!present(i)) return;
            const state = i === s.node ? "active" : (done.includes(i) ? "done" : "default");
            tl.set("#tnode-" + i, { attr: { "data-state": state } }, t);
          });
          if (V.showOutput && visitCount > 0) {
            for (let c = 0; c < visitCount; c++) {
              const filled = c < done.length;
              tl.set("#out-" + c, { autoAlpha: filled ? 1 : 0,
                                    textContent: filled ? raw[done[c]] : "" }, t);
            }
          }
          tl.set(noteEl, { innerHTML: s.note }, t);
          tl.set(counterEl, { textContent: "STEP " + (k + 1) + " / " + steps.length }, t);
          if (k === 0) tl.from(noteEl, { opacity: 0, y: 12, duration: 0.45, ease: "power3.out" }, 0.15);
        });
        tl.to({}, { duration: STEP }, (steps.length - 1) * STEP);
        window.__timelines["binary-tree"] = tl;
        // Registered after the runtime initialised, so it must be re-bound: without
        // this `render` saw a zero-length composition ("Composition has zero
        // duration") although `snapshot` and the browser played it.
        window.__hfForceTimelineRebind?.();
      });
    </script>
  </body>
