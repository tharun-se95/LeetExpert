name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The reference-solution tests execute every sandbox in BOTH runtimes.
      # Without Python here, half that guarantee silently disappears — so the
      # suite asserts python3 is present rather than skipping quietly.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      # Content validation runs before the build: a bad fence id or malformed
      # spec still builds successfully and only fails in the browser, so the
      # build passing is not evidence the content is intact.
      - name: Test
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build
        env:
          # Explicit for clarity; load.ts also walks up to find part-1-foundations.
          HANDBOOK_ROOT: ${{ github.workspace }}
