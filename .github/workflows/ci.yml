name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The reference-solution tests execute every sandbox in BOTH runtimes.
      # Without Python here, half that guarantee silently disappears — so the
      # suite asserts python3 is present rather than skipping quietly.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      # Content validation runs before the build: a bad fence id or malformed
      # spec still builds successfully and only fails in the browser, so the
      # build passing is not evidence the content is intact.
      - name: Test
        working-directory: web
        run: npm test

      # public/lessons/ is committed (the deploy has no Python), so it can drift
      # from lesson-artifacts/. Rebuild from source and require the same bytes.
      - name: Committed lesson pages match their sources
        working-directory: web
        run: |
          python3 lesson-artifacts/build.py
          node scripts/build-lesson-artifacts.mjs
          test -z "$(git status --porcelain -- public/lessons)" || { git status --short -- public/lessons; exit 1; }

      - name: Build
        working-directory: web
        run: npm run build
        env:
          # Explicit for clarity; load.ts also walks up to find part-1-foundations.
          HANDBOOK_ROOT: ${{ github.workspace }}

  # The lesson artifacts' gates (#23). ledger.py check (in npm test) proves the evidence is well formed;
  # this re-runs the gates themselves on every page that has held verified evidence, so a kit change that
  # breaks a verified page fails here, not only goes stale in the ledger.
  artifact-pages:
    name: Artifact pages to gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pages: ${{ steps.list.outputs.pages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: List
        id: list
        run: echo "pages=$(python3 web/lesson-artifacts/ledger.py gated)" >> "$GITHUB_OUTPUT"

  artifact-gates:
    name: Artifact gates (${{ matrix.page }}, ${{ matrix.theme }})
    needs: artifact-pages
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        page: ${{ fromJSON(needs.artifact-pages.outputs.pages) }}
        # one job per theme: a page of many step players outruns one job running both in sequence
        theme: [light, dark]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # the code gate runs every shown solution in both runtimes
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: web
        run: npm ci
      # the browser gate drives the runner's installed Chrome (playwright-core, channel "chrome")
      - name: Gates
        working-directory: web
        run: python3 lesson-artifacts/ledger.py gate ${{ matrix.page }} ${{ matrix.theme }}
      - name: Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-shots-${{ strategy.job-index }}-${{ matrix.theme }}
          path: web/lesson-artifacts/dist/_gate/
          if-no-files-found: ignore
